plugins { id 'com.android.application' }

android {
    namespace 'com.moyu.chat'
    compileSdkVersion 34
    defaultConfig {
        applicationId 'com.moyu.chat'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 1
        versionName '0.0.1'
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}

def uiRoot = file('../..')
def uiAssets = file('src/main/assets/ui')
tasks.register('syncMoyuChatUi', Sync) {
    from(uiRoot) {
        include 'index.html'
        include 'src/**'
    }
    into(uiAssets)
}
preBuild.dependsOn syncMoyuChatUi

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
    testImplementation 'junit:junit:4.13.2'
}
