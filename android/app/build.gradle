plugins { id 'com.android.application' }

android {
    namespace 'com.moyu.chat'
    compileSdkVersion 34
    defaultConfig {
        // Beta line installs beside the original com.moyu.chat build; Java namespace stays com.moyu.chat.
        applicationId 'com.moyu.chat.beta'
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 6
        versionName '0.0.6-beta'
    }
    buildTypes {
        debug { debuggable true }
        release {
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    // MainActivity reads BuildConfig.DEBUG for WebView debugging; AGP 8 no longer generates it by default.
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    testOptions { unitTests { includeAndroidResources = true } }
}

def uiRoot = file('../..')
def uiAssets = file('src/main/assets/ui')
tasks.register('syncMoyuChatUi', Sync) {
    from(uiRoot) {
        include 'index.html'
        include 'src/**'
    }
    into(uiAssets)
}
preBuild.dependsOn syncMoyuChatUi

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
    testImplementation 'junit:junit:4.13.2'
    // Real org.json implementation so JVM unit tests exercise the same parsing code paths as on-device.
    testImplementation 'org.json:json:20240303'
    testImplementation 'com.squareup.okhttp3:mockwebserver:5.0.0-alpha.11'
    testImplementation 'org.robolectric:robolectric:4.11.1'
}
